apply plugin: 'maven-publish'
apply plugin: 'signing'

task androidSourcesJar(type: Jar) {
    archiveClassifier.set('sources')
    from android.sourceSets.main.java.getSrcDirs()

    exclude "**/R.class"
    exclude "**/BuildConfig.class"
}

ext {
//    PUBLISH_GROUP_ID = 'io.github.vfhhu'
    PUBLISH_VERSION = android.defaultConfig.versionName
}
//ext {
//    PUBLISH_GROUP_ID = 'com.sunsta.livery'
//    PUBLISH_ARTIFACT_ID = 'livery'
//    PUBLISH_VERSION = '1.2.0'
//}

ext["signing.keyId"] = ''
ext["signing.password"] = ''
ext["signing.secretKeyRingFile"] = ''
ext["ossrhUsername"] = ''
ext["ossrhPassword"] = ''
ext["github.url"] = ''
ext["developer.description"] = ''
ext["ossrhEmil"] = ''
ext["ossrhFullname"] = ''
ext["github.git"] = ''
ext["github.connection"] = ''
ext["github.developerConnection"] = ''
ext["github.fork_url"] = ''
ext["PUBLISH_GROUP_ID"] = ''
ext["PUBLISH_ARTIFACT_ID"] = ''


//File secretPropsFile = project.rootProject.file('local.properties')
File secretPropsFile = project.file('local.properties')
Properties p = new Properties()
if (secretPropsFile.exists()) {
    println "Found secret props file, loading props"

    p.load(new FileInputStream(secretPropsFile))
    p.each { name, value ->
        ext[name] = value
    }
} else {
    println "No props file, loading env vars"
}

publishing {
    publications {
        bar(MavenPublication){
            groupId "io.github.adlocushyxen"
            artifactId "adlocusaar"
            version "4.1.58"
            artifact("$buildDir/outputs/aar/adlocusaar-release.aar")
        }
    }

    repositories {
        maven {
            name "GithubPackages"
            url uri("https://maven.pkg.github.com/adlocushyxen/adlocusaar")
            credentials{
                username = p.getProperty("githubUser")
                password = p.getProperty("githubToken")
            }
        }
    }
}

