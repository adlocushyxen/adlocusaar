apply plugin: 'com.android.library'


android {
//    compileSdkVersion 26
    namespace "com.hyxen.adlocusaar"
    compileSdkVersion 35



    defaultConfig {
        //minSdkVersion 19
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 175
        versionName "4.1.55"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        // Library 模組要手動生成 BuildConfig 常量
        buildConfigField "String", "VERSION_NAME", "\"4.1.55\""
        buildConfigField "int", "VERSION_CODE", "175"

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig = true
    }
}
